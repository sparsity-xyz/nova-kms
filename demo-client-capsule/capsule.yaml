version: v1
name: "nova-kms-client-capsule"
target: "nitro-enclave"

sources:
  app: "."

ingress:
  - listen_port: 8000
  - listen_port: 18001

egress:
  allow:
    - "0.0.0.0/0"
    - "::/0"
    - "**"

env:
  - IN_ENCLAVE
  - TEST_CYCLE_INTERVAL_SECONDS
  - FIXED_DERIVE_PATH
  - KV_DATA_KEY
  - CAPSULE_ENDPOINT
  - CAPSULE_TIMEOUT_SECONDS
