version: v1
name: "nova-kms-client-capsule"
target: "nitro-enclave"

sources:
  app: "."

ingress:
  - listen_port: 8000
  - listen_port: 18001

egress:
  allow:
    # In enclave mode this demo talks to the local Capsule endpoint.
    # If you override that URL to an external host, add it here explicitly.
    - "localhost"
    - "127.0.0.1/32"
    - "::1/128"

env:
  - IN_ENCLAVE
  - TEST_CYCLE_INTERVAL_SECONDS
  - FIXED_DERIVE_PATH
  - KV_DATA_KEY
  - CAPSULE_ENDPOINT
  - CAPSULE_TIMEOUT_SECONDS
